web_server = "0.0.0.0:8080"
default_api_version = 1
log_path = "./logs"
udp_server_timeout = 10
mavlink_system_id = 1
mavlink_component_id = 191
mavlink_heartbeat_frequency = 1

[[serial]]
device = "/dev/ttyAMA3"
baudrate = 921600

[[udp_client]]
address = "127.0.0.1"
port = 14540

[[tcp_server]]
address = "0.0.0.0"
port = 5760

# Companion injects (e.g. GPS_INJECT_DATA / RTCM→MAVLink) listen here.
[[udp_server]]
port = 14580

# Optional alternate inject port (not enabled by default):
# [[udp_server]]
# port = 14581
